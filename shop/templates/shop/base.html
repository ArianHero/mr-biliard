{% load static %}<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="کاتالوگ مستر بیلیارد و ثبت درخواست مشاوره و نصب میز بیلیارد">
<title>{% block title %}مستر بیلیارد | فروشگاه و نصب میز بیلیارد{% endblock %}</title>
<link rel="stylesheet" href="{% static 'shop/site.css' %}">
</head>
<body>
<div class="loading" hidden role="status" aria-label="در حال بارگذاری"><i class="game-ball eight" aria-hidden="true">8</i></div>
<script>
const loader = document.querySelector(".loading");
loader.hidden = false;
const hideLoader = () => {loader.hidden = true};
window.addEventListener("load", hideLoader, {once:true});
window.addEventListener("pageshow", hideLoader);
setTimeout(hideLoader, 2500);
</script>
<header class="shell nav">
<a class="brand" href="{% url 'storefront' %}"><span class="ball" aria-hidden="true">8</span><span>مستر بیلیارد<small lang="en" dir="ltr">MR. BILIARD</small></span></a>
<nav aria-label="منوی اصلی"><a href="{% url 'tables' %}">میزهای بیلیارد</a><a href="{% url 'accessories' %}">سایر محصولات</a><a href="{% url 'storefront' %}#installation">تماس با مدیران</a></nav>
<a class="outline social" href="https://ig.me/m/mr.biliard">دایرکت اینستاگرام ↗</a>
</header>
<main>{% block content %}{% endblock %}</main>
<footer class="shell footer"><a href="{% url 'storefront' %}">مستر بیلیارد</a><a href="https://www.instagram.com/mr.biliard/" dir="ltr">@mr.biliard ↗</a></footer>
</body>
</html>
